<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafe Shop</title>
  <style>
  body {
    background-color: #f8f8f8;
    color: #333;
    font-family: Arial, sans-serif;
    text-align: center;
  }

  h1 {
    color: #333;
  }

  table {
    margin: 20px auto;
    border: 1px solid #ccc;
    border-collapse: collapse;
    width: 70%;
  }

  th, td {
    border: 1px solid #ccc;
    padding: 8px;
  }

  th {
    background-color: #e0e0e0;
  }

  td img {
    width: 50px;
    height: 50px;
  }
</style>

</head>
<body>

  <h1>Welcome to Snack Station!</h1>

  <table>
    <tr>
      <th>Image of Prouduct</th>
      <th>Product Name</th>
      <th>Price</th>
      <th>Quantity</th>
      <th>In Stock</th>
    </tr>
    <tr>
      <td><img src="https://img.freepik.com/premium-psd/coffee-cup-no-background-png_1047544-3.jpg?w=740" alt="Hot Cappuccino"></td>
      <td>Hot Cappuccino</td>
      <td>$3</td>
      <td>25</td>
      <td>YES</td>
    </tr>
    <tr>
      <td><img src="https://tse4.mm.bing.net/th/id/OIP.xeVEReXYgoycdDUdnPKSawHaHa?pid=Api&P=0&h=220" alt="Burger"></td>
      <td>Burger</td>
      <td>$2</td>
      <td>30</td>
      <td>YES</td>
    </tr>
    <tr>
      <td><img src="https://tse4.mm.bing.net/th/id/OIP.7o1HUz88p3oWQQ_Ny7kTKAHaHa?pid=Api&P=0&h=220" alt="Croissant"></td>
      <td>Croissant</td>
      <td>$1.5</td>
      <td>10</td>
      <td>NO</td>
    </tr>
  </table>

</body>
</html>
